name: Scrape and deploy OLH dashboard

on:
  schedule:
    - cron: "0 8,20 * * *"
      timezone: "Asia/Kolkata"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  deployments: write

jobs:
  scrape-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install scraper requirements
        if: github.event_name != 'push'
        run: pip install -r requirements-scraper.txt

      - name: Scrape Ashraya data
        if: github.event_name != 'push'
        run: python Scraping.py

      - name: Save scraper diagnostics
        if: always() && github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: scraper-debug
          path: scraper-debug/
          if-no-files-found: ignore

      - name: Save updated data to GitHub
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ashraya_master_report.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Ashraya availability data"
            git push
          else
            echo "No data changes to commit."
          fi

      - name: Build public site
        run: python build_public.py

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy publish --project-name=olh-sitemap-preview
